<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG HUBS — Concept Group</title>
<link rel="icon" href="shared/img/concept-logo-gold.png">
<style>
  :root {
    --navy:#1F3864; --navy-2:#2A4A7F; --gold:#C9A227; --gold-soft:#F6EDD0;
    --bg:#F4F6FA; --card:#FFFFFF; --text:#1D2433; --muted:#5B6578; --line:#DDE3EE;
    --bad:#B03030; --radius:12px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI", Calibri, Carlito, Arial, sans-serif; min-height:100vh; }

  header { background:var(--navy); color:#fff; }
  .bar { max-width:1100px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:16px; }
  .bar img { height:52px; width:auto; }
  .bar .brand { font-size:20px; font-weight:700; letter-spacing:.5px; padding-left:16px; border-left:1px solid rgba(255,255,255,.25); }
  .bar .brand span { color:var(--gold); }
  .bar .who { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:14px; color:#DDE6F5; }
  .bar .who[hidden] { display:none; }

  .btn { border:0; border-radius:8px; padding:9px 18px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; }
  .btn.gold { background:var(--gold); color:var(--navy); }
  .btn.gold:hover { background:#D8B33A; }
  .btn.ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.45); padding:6px 14px; font-size:13px; }
  .btn.ghost:hover { background:rgba(255,255,255,.1); }

  main { max-width:1100px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:24px; margin:0 0 4px; color:var(--navy); }
  .sub { color:var(--muted); margin:0 0 28px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:18px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px;
          display:flex; flex-direction:column; gap:6px; text-decoration:none; color:inherit;
          border-top:4px solid var(--gold); transition:box-shadow .15s, transform .15s; min-height:150px; }
  .tile:hover, .tile:focus-visible { box-shadow:0 6px 20px rgba(31,56,100,.14); transform:translateY(-2px); outline:none; }
  .tile .name { font-size:18px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tile .unit { color:var(--muted); font-size:14px; }
  .tile { position:relative; }
  .tile.is-mobile { padding-right:52px; }
  .tile .device { position:absolute; top:10px; right:0; bottom:16px; width:30px; background:var(--navy); color:#fff;
                  border-radius:4px 0 0 4px; writing-mode:vertical-rl; text-align:center; font-size:12px;
                  font-weight:600; letter-spacing:1.5px; text-transform:uppercase; display:flex; align-items:center; justify-content:center; }
  .tile .open { margin-top:auto; color:var(--navy-2); font-weight:600; font-size:14px; }
  .pv { background:var(--gold-soft); color:#7A5F0E; font-size:11px; font-weight:700; text-transform:uppercase;
        letter-spacing:.5px; padding:2px 8px; border-radius:999px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:0 0 32px;
          max-width:460px; margin:40px auto 0; text-align:center; overflow:hidden; }
  .card > :not(.hero) { margin-left:24px; margin-right:24px; }
  .card .hero { background:var(--navy); padding:36px 24px 30px; margin:0 0 28px; border-bottom:4px solid var(--gold); }
  .card .hero img { width:208px; max-width:80%; height:auto; display:block; margin:0 auto; }
  .card h2 { margin:0 0 10px; color:var(--navy); font-size:22px; }
  .card p { color:var(--muted); line-height:1.5; margin:0 0 18px; }
  .card .err { color:var(--bad); background:#FBECEC; border-radius:8px; padding:10px 12px; text-align:left;
               font-size:14px; line-height:1.45; margin-top:16px; }
  .card .btn.gold { background:var(--navy); color:#fff; }
  .card .btn.gold:hover { background:var(--navy-2); }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 16px 24px; }
  @media (max-width:560px) { .bar .brand { display:none; } .bar img { height:42px; } main { padding-top:24px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <img src="shared/img/concept-logo-gold.png" alt="Concept Group">
    <div class="brand">CG <span>HUBS</span></div>
    <div class="who" id="who" hidden>
      <span id="whoName"></span>
      <button class="btn ghost" id="signOut" type="button">Sign out</button>
    </div>
  </div>
</header>

<main id="main" aria-live="polite">
  <div class="card"><p>Loading…</p></div>
</main>
<footer>© Concept Group Limited</footer>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script src="shared/cg-config.js"></script>
<script src="shared/cg-core.js"></script>
<script>
(function () {
  "use strict";
  const main = document.getElementById("main");
  const esc = CG.esc;

  function signInCard(errorText) {
    main.innerHTML = `
      <div class="card">
        <div class="hero"><img src="shared/img/concept-logo-gold.png" alt="Concept Group"></div>
        <h2>Welcome to CG HUBS</h2>
        <p>Sign in with your Concept Group Microsoft account to see the Hubs available to you.</p>
        <button class="btn gold" id="signIn" type="button">Sign in</button>
        ${errorText ? `<div class="err">${esc(errorText)}</div>` : ""}
      </div>`;
    document.getElementById("signIn").onclick = () =>
      CG.auth.signIn().catch(e => signInCard(e.message));
  }

  function notReadyCard() {
    main.innerHTML = `
      <div class="card">
        <div class="hero"><img src="shared/img/concept-logo-gold.png" alt="Concept Group"></div>
        <h2>CG HUBS is being prepared</h2>
        <p>The new home for the Concept Group Hubs isn't switched on yet.
           Please continue to use your usual Hub links for now.</p>
      </div>`;
  }

  function firstName(account) {
    const n = String(account.name || account.username || "").trim();
    return n.split(/[\s@.]/)[0] || n;
  }

  function showHubs(account) {
    const email = CG.auth.email();
    document.getElementById("whoName").textContent = account.name || account.username;
    document.getElementById("who").hidden = false;
    document.getElementById("signOut").onclick = () => CG.auth.signOut();

    const apps = CG.apps().filter(a => CG.appAllowed(a.key, email));
    const unknown = CG.apps().some(a => CG.appAccess(a.key, email).reason === "groups-unknown");
    const who = typeof CG_ACCESS_CONTACT !== "undefined" ? CG_ACCESS_CONTACT : "your administrator";
    const hello = `<h1>Good ${greeting()}, ${esc(firstName(account))}</h1>`;
    const note = unknown ? `<p class="sub" style="color:#B03030">Some Hubs couldn't check your access - your Microsoft sign-in didn't include your group memberships. Please send a screenshot of this page to ${esc(who)}.</p>` : "";
    if (!apps.length) {
      main.innerHTML = hello + note + `<p class="sub">No Hubs are available to you yet. If you need one, please ask ${esc(who)}.</p>`;
      return;
    }
    main.innerHTML = hello + note + `<p class="sub">Choose a Hub to open.</p>
      <div class="grid">${apps.map(a => `
        <a class="tile${a.device === "mobile" ? " is-mobile" : ""}" href="${esc(CG.appUrl(a.key))}">
          <div class="name">${esc(a.name)}${CG.appState(a.key) === "preview" || a.badge === "preview" ? '<span class="pv" title="Preview - still being trialled">Preview</span>' : ""}</div>
          <div class="unit">${esc(a.unit)}</div>
          <div class="open">Open →</div>
          ${a.device === "mobile" ? '<div class="device" title="Mainly used on a phone">Mobile</div>' : ""}
        </a>`).join("")}
      </div>`;
  }

  function greeting() {
    const h = new Date().getHours();
    return h < 12 ? "morning" : h < 17 ? "afternoon" : "evening";
  }

  async function start() {
    if (typeof CG_LAUNCHER === "undefined" || String(CG_LAUNCHER.clientId).startsWith("<<")) { notReadyCard(); return; }
    try {
      const account = await CG.auth.init({ app: "launcher", clientId: CG_LAUNCHER.clientId, scopes: CG_LAUNCHER.scopes });
      if (account) showHubs(account);
      else if (!CG.isAuthReturnInChildWindow()) signInCard();
    } catch (e) {
      signInCard(e.message);
    }
  }
  start();
})();
</script>
</body>
</html>
