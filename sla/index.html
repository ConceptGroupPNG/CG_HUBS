/* ============================================================
   EMAIL INTAKE — staff-triaged, shared mailbox via delegated Graph.
   Requires the signed-in user to have delegated access to HELPDESK_MAILBOX.
   ============================================================ */
let inboxMessages = [];
let emailDetailId = null;
let emailDetailCache = {};
let selectedEmailIds = new Set(); // for bulk "delete selected" in the review queue

// Every acknowledgment email SLA HUB sends embeds the ticket's tracking
// number in the subject (see sendTicketAcknowledgment) — "[SLA-42] We've
// received…". Most mail clients keep the subject line through Reply/Reply
// All, so this is how a reply back to that number gets recognised.
// Turns HTML email content into plain text for storage/display — the div is
// never attached to the document, so nothing in it (styles, scripts, images)
// ever runs or loads; this only ever reads back .textContent.
function stripHtml(html){
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return (div.textContent || div.innerText || "").trim();
}

// Captures one reply email onto its ticket's Conversation. Best-effort and
// non-fatal — a failed import just leaves the email to be picked up again on
// the next refresh rather than blocking Email Intake.
async function importReplyIntoConversation(m, ticket){
  let bodyText = m.bodyPreview || "";
  try{
    const full = await callGraph(`${GRAPH}/users/${encodeURIComponent(HELPDESK_MAILBOX)}/messages/${m.id}?$select=body`);
    if(full?.body?.content){
      bodyText = full.body.contentType === "html" ? stripHtml(full.body.content) : full.body.content;
    }
  }catch(e){
    console.warn("Couldn't fetch full body for a ticket reply, using the preview instead:", e);
  }
  try{
    const created = await graphCreateItem("SLA_TicketConversations", {
      Title: `Reply on ${ticket.fields.TicketNumber||ticket.id}`,
      TicketId: Number(ticket.id),
      Direction: "Inbound",
      FromName: m.from?.emailAddress?.name || m.from?.emailAddress?.address || "",
      FromEmail: m.from?.emailAddress?.address || "",
      Subject: m.subject || "",
      Body: bodyText.slice(0, 4000),
      InternetMessageId: m.internetMessageId || "",
      MessageDate: m.receivedDateTime || nowIso(),
      LoggedAt: nowIso()
    });
    state.ticketConversations.push(created);
  }catch(e){
    console.warn("Couldn't log a reply email to SLA_TicketConversations (run Add-SLAHub-TicketConversations.ps1 if this list doesn't exist yet):", e);
  }
}

async function renderEmail(){
  // The page shell (header + the two wraps below) is only built once, the
  // first time this page is opened — not on every call. This function gets
  // invoked repeatedly (the auto-refresh timer calls it directly whenever
  // Email Intake is on screen, and a multi-write action like converting an
  // email can trigger more than one of those in a row): rebuilding the whole
  // page each time, including a "Loading inbox…" wipe, is what produced the
  // visible flashing. Now a re-render just swaps the list's contents in
  // place once the fresh data is in, leaving the existing table (and any
  // open detail panel) on screen while that fetch is in flight.
  const shellMissing = !document.getElementById("emailListWrap");
  if(shellMissing){
    emailDetailId = null;
    emailDetailCache = {};
    selectedEmailIds = new Set();
    document.getElementById("page-email").innerHTML = `
      <div class="page-header">
        <div><h2>Email Intake</h2><div class="sub">${esc(HELPDESK_MAILBOX)} — staff review each email and convert it into a ticket</div></div>
        <button class="btn" onclick="renderEmail()">↻ Refresh</button>
      </div>
      <div id="emailBulkBar" class="modal-actions" style="justify-content:flex-start;margin-bottom:10px;" hidden>
        <span id="emailBulkCount" style="font-size:13px;color:var(--ink-2);align-self:center;margin-right:4px;"></span>
        <button class="btn btn-sm" onclick="clearEmailSelection()">Clear selection</button>
        <button class="btn btn-sm btn-danger" onclick="confirmDeleteSelectedEmails(this)">Delete selected</button>
      </div>
      <div id="emailListWrap"><div class="empty">Loading inbox…</div></div>
      <div id="emailDetailWrap"></div>
    `;
  }
  try{
    const url = `${GRAPH}/users/${encodeURIComponent(HELPDESK_MAILBOX)}/mailFolders/inbox/messages`
      + `?$top=30&$orderby=receivedDateTime desc&$select=id,subject,from,receivedDateTime,bodyPreview,internetMessageId,conversationId`;
    const res = await callGraph(url);
    // "Already converted" is tracked by matching internetMessageId against every
    // ticket's own SourceMessageId (in SLA_Tickets, already loaded in state) —
    // not by writing a category back onto the shared mailbox message. Reading
    // the mailbox only needs delegated read access; earlier this wrote a
    // "SLA-Converted" category back onto the message, which needs write access
    // to the shared mailbox and was failing with a 403 for some signed-in users.
    const convertedIds = new Set(state.tickets.map(t => t.fields.SourceMessageId).filter(Boolean));
    // "Deleted" from the queue works the same non-destructive way — see
    // deleteEmailFromIntake(). The email itself is never touched or removed
    // from the shared mailbox, it's just recorded here so it stops showing up.
    const dismissedIds = new Set(state.dismissedEmails.map(d => d.fields.InternetMessageId).filter(Boolean));
    const candidates = (res.value||[]).filter(m => !convertedIds.has(m.internetMessageId) && !dismissedIds.has(m.internetMessageId));

    // A reply within the same email thread as a ticket's acknowledgment
    // email (sent to the requester) or its assignment notification (sent to
    // the assignee) gets captured straight onto that ticket's Conversation
    // instead of sitting in the review queue as an unrelated new email —
    // matched via Graph's own conversationId (see sendGraphMailTracked(),
    // AckConversationId and AssignConversationId, each saved on the ticket
    // when the corresponding email goes out). This is independent of the
    // subject line, so it still works even if a reply drops or mangles the
    // "[SLA-42]" tag. Already-imported replies are recognised by
    // InternetMessageId and stay hidden here too, they just don't need
    // importing again.
    const ticketByConversationId = new Map();
    for(const t of state.tickets){
      if(t.fields.AckConversationId) ticketByConversationId.set(t.fields.AckConversationId, t);
      if(t.fields.AssignConversationId) ticketByConversationId.set(t.fields.AssignConversationId, t);
    }
    const importedIds = new Set(state.ticketConversations.map(c => c.fields.InternetMessageId).filter(Boolean));
    const stillNeedingReview = [];
    for(const m of candidates){
      const ticket = m.conversationId ? ticketByConversationId.get(m.conversationId) : null;
      const fromHelpdesk = (m.from?.emailAddress?.address||"").toLowerCase().trim() === HELPDESK_MAILBOX.toLowerCase();
      if(ticket && !fromHelpdesk){
        if(!importedIds.has(m.internetMessageId)){
          await importReplyIntoConversation(m, ticket);
        }
        continue; // belongs to the ticket's conversation now, not the review queue
      }
      stillNeedingReview.push(m);
    }
    inboxMessages = stillNeedingReview;
    // Drop any selection for emails that no longer appear in the queue
    // (converted, dismissed, or just auto-matched to a ticket above).
    selectedEmailIds = new Set(Array.from(selectedEmailIds).filter(id => inboxMessages.some(m => m.id === id)));
  }catch(e){
    console.error(e);
    // Only replace the list with the error state if there's nothing already
    // showing — a background refresh that fails shouldn't blank out a list
    // the user can already see.
    if(shellMissing || !inboxMessages.length){
      document.getElementById("emailListWrap").innerHTML = `<div class="empty">Couldn't load the shared mailbox: ${esc(e.message)}<br>Check that your account has delegated access to ${esc(HELPDESK_MAILBOX)}.</div>`;
    }else{
      console.warn("Email Intake background refresh failed, keeping the existing list on screen.");
    }
    return;
  }
  const allSelected = inboxMessages.length>0 && inboxMessages.every(m => selectedEmailIds.has(m.id));
  document.getElementById("emailListWrap").innerHTML = inboxMessages.length ? `
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:12.5px;color:var(--ink-2);">
      <input type="checkbox" id="emailSelectAllCb" ${allSelected?"checked":""} onclick="toggleAllEmailSelection(this)">
      <label for="emailSelectAllCb" style="cursor:pointer;">Select all</label>
    </div>
    <div class="record-list">
      ${inboxMessages.map(m => `
      <div class="record-card clickable" onclick="openEmailDetail('${m.id}')">
        <div class="record-card-top">
          <div style="display:flex;gap:11px;align-items:flex-start;">
            <input type="checkbox" onclick="event.stopPropagation()" ${selectedEmailIds.has(m.id)?"checked":""} onchange="toggleEmailSelection('${m.id}', this.checked)" style="margin-top:3px;">
            <div>
              <div class="record-card-title">${esc(m.subject||"(no subject)")}</div>
              <div class="record-card-sub">${esc(m.from?.emailAddress?.name || m.from?.emailAddress?.address || "—")} · ${fmtDateTime(m.receivedDateTime)}</div>
            </div>
          </div>
          <div class="record-card-actions">
            <button class="btn btn-sm btn-accent" onclick="event.stopPropagation(); convertEmailToTicket('${m.id}')">Review</button>
          </div>
        </div>
        <div class="record-card-meta" style="border-top:none;padding-top:0;margin-top:9px;">
          <span>${esc((m.bodyPreview||"").slice(0,140))}</span>
        </div>
      </div>`).join("")}
    </div>
  ` : `<div class="empty">No unconverted emails in the inbox.</div>`;
  updateEmailBulkBar();
}

function toggleEmailSelection(messageId, checked){
  if(checked) selectedEmailIds.add(messageId); else selectedEmailIds.delete(messageId);
  updateEmailBulkBar();
}
function toggleAllEmailSelection(checkboxEl){
  if(checkboxEl.checked) inboxMessages.forEach(m => selectedEmailIds.add(m.id));
  else selectedEmailIds.clear();
  renderEmail();
}
function clearEmailSelection(){
  selectedEmailIds.clear();
  renderEmail();
}
function updateEmailBulkBar(){
  const bar = document.getElementById("emailBulkBar");
  if(!bar) return;
  const n = selectedEmailIds.size;
  bar.hidden = n === 0;
  const countEl = document.getElementById("emailBulkCount");
  if(countEl) countEl.textContent = `${n} selected`;
}

// Two-click confirm on the button itself, same lightweight pattern used for
// deleting a single attachment — SharePoint's own list still holds every
// dismissal record in SLA_DismissedEmails if one needs undoing by hand.
function confirmDeleteSelectedEmails(btn){
  if(btn.dataset.armed === "1"){ deleteSelectedEmails(); return; }
  btn.dataset.armed = "1";
  const original = btn.textContent;
  btn.textContent = "Confirm?";
  setTimeout(() => { if(btn.isConnected){ btn.dataset.armed = "0"; btn.textContent = original; } }, 3000);
}

async function deleteSelectedEmails(){
  const ids = Array.from(selectedEmailIds);
  if(!ids.length) return;
  await withBatchedRefresh(async () => {
    for(const id of ids){
      const m = inboxMessages.find(x => x.id === id);
      if(!m) continue;
      try{
        const created = await graphCreateItem("SLA_DismissedEmails", {
          Title: "Dismissed email",
          InternetMessageId: m.internetMessageId || "",
          Subject: m.subject || "",
          DismissedByName: currentAccount?.name || currentAccount?.username || "",
          DismissedByEmail: (currentAccount?.username || "").toLowerCase().trim(),
          DismissedAt: nowIso()
        });
        state.dismissedEmails.push(created);
      }catch(e){
        console.error(e);
        toast(`Couldn't remove "${m.subject||"an email"}": ${e.message}`, true);
      }
    }
  });
  inboxMessages = inboxMessages.filter(x => !selectedEmailIds.has(x.id));
  const removedCount = ids.length;
  selectedEmailIds.clear();
  toast(`Removed ${removedCount} email${removedCount===1?"":"s"} from the review queue`);
  renderEmail();
}

async function openEmailDetail(id){
  emailDetailId = id;
  renderEmailDetail();
  document.getElementById("emailDetailWrap").scrollIntoView({behavior:"smooth"});
  if(!emailDetailCache[id]){
    try{
      const full = await callGraph(`${GRAPH}/users/${encodeURIComponent(HELPDESK_MAILBOX)}/messages/${id}`
        + `?$select=subject,from,toRecipients,ccRecipients,receivedDateTime,body`);
      emailDetailCache[id] = full;
    }catch(e){
      console.error(e);
      emailDetailCache[id] = { _error: e.message };
    }
    renderEmailDetail();
  }

function renderEmailDetail(){
  const wrap = document.getElementById("emailDetailWrap");
  if(!wrap) return;
  if(!emailDetailId){ wrap.innerHTML = ""; return; }
  const m = inboxMessages.find(x => x.id === emailDetailId);
  if(!m){ wrap.innerHTML = ""; return; }
  const full = emailDetailCache[emailDetailId];
  const fromAddr = m.from?.emailAddress?.address || "";
  const fromName = m.from?.emailAddress?.name || fromAddr;
  const toLine = (full && !full._error) ? (full.toRecipients||[]).map(r=>r.emailAddress?.address).filter(Boolean).join(", ") : "";
  const ccLine = (full && !full._error) ? (full.ccRecipients||[]).map(r=>r.emailAddress?.address).filter(Boolean).join(", ") : "";

  let bodyHtml;
  if(!full){
    bodyHtml = `<div class="empty">Loading message…</div>`;
  } else if(full._error){
    bodyHtml = `<div class="empty">Couldn't load the full message: ${esc(full._error)}<br>Showing the preview instead:<br><br>${esc(m.bodyPreview||"")}</div>`;
  } else if(full.body?.contentType === "html"){
    // Sandboxed, no scripts/same-origin — renders the email safely without letting it touch the app.
    bodyHtml = `<iframe sandbox="allow-popups" style="width:100%;min-height:380px;border:1px solid var(--border);border-radius:8px;background:#fff;" srcdoc="${esc(full.body.content||"")}"></iframe>`;
  } else {
    bodyHtml = `<div style="white-space:pre-wrap;">${esc(full.body?.content || m.bodyPreview || "")}</div>`;
  }

  wrap.innerHTML = `
    <div class="detail-panel" style="margin-top:16px;">
      <button class="close" onclick="emailDetailId=null; renderEmailDetail();">✕</button>
      <h3 style="margin:0 0 4px;">${esc(m.subject||"(no subject)")}</h3>
      <div style="color:var(--ink-2);font-size:13px;margin-bottom:10px;">
        From ${esc(fromName)}${fromAddr?` (${esc(fromAddr)})`:""} · ${fmtDateTime(m.receivedDateTime)}
        ${toLine?`<br>To: ${esc(toLine)}`:""}${ccLine?`<br>Cc: ${esc(ccLine)}`:""}
      </div>
      <div class="section-title">Message</div>
      ${bodyHtml}
      <div class="modal-actions" style="justify-content:flex-start;margin-top:14px;">
        <button class="btn btn-sm btn-accent" onclick="convertEmailToTicket('${m.id}')">Review</button>
      </div>
    </div>
  `;
}

function matchClientByEmail(email){
  // Best-effort: matches on a resource's MatchEmail domain, falls back to none.
  email = (email||"").toLowerCase().trim();
  const domain = email.split("@")[1] || "";
  const match = state.clients.find(c => (c.fields.EmailAddress||"").toLowerCase().includes(domain) && domain);
  return match ? match.id : "";
}

// "Delete" on the review screen clears the email out of Email Intake's queue
// only — it does NOT touch the actual email in the shared mailbox. Nothing
// is removed from Outlook; support@concept.com.pg keeps the message exactly
// as it was, in case anyone needs to find it later. Recording the dismissal
// here (instead of really deleting) also means this needs no extra
// mailbox-write permission beyond what Email Intake already has.
async function deleteEmailFromIntake(messageId){
  const m = inboxMessages.find(x => x.id === messageId);
  if(!m) return;
  try{
    const created = await graphCreateItem("SLA_DismissedEmails", {
      Title: "Dismissed email",
      InternetMessageId: m.internetMessageId || "",
      Subject: m.subject || "",
      DismissedByName: currentAccount?.name || currentAccount?.username || "",
      DismissedByEmail: (currentAccount?.username || "").toLowerCase().trim(),
      DismissedAt: nowIso()
    });
    state.dismissedEmails.push(created);
    inboxMessages = inboxMessages.filter(x => x.id !== messageId);
    closeModal();
    toast("Removed from the review queue");
    renderEmail();
  }catch(e){
    console.error(e);
    toast("Couldn't remove this email: " + e.message, true);
  }
}

async function submitEmailTicketForm(messageId){
  const m = inboxMessages.find(x => x.id === messageId);
  // The ticket's SourceMessageId (set below) is what keeps this email from
  // showing up again in Email Intake — see renderEmail(). No write back to
  // the shared mailbox is needed, so this can't 403 on a delegated-read-only
  // account the way the old "tag the email as converted" approach could.
  await submitTicketFormCore({ sourceMessageId: m?.internetMessageId || messageId, source: "Email" });
  if(m){
    inboxMessages = inboxMessages.filter(x => x.id !== messageId);
    renderEmail();
  }
}

/* Shared core so both the manual "+ New ticket" form and the email-conversion
   form create tickets the same way. */
async function submitTicketFormCore(opts={}){
  const title = document.getElementById("tf_title").value.trim();
  if(!title){ toast("Title is required", true); return; }
  const priority = document.getElementById("tf_priority").value;
  let clientId = document.getElementById("tf_client").value;
  let endClientId = document.getElementById("tf_endclient").value;
  const now = new Date();

  // Owning entity (Agreement / Work Order / Ad Hoc) — resolved from state
  // directly rather than trusting the UI's auto-fill, so a ticket always
  // ends up with the right Client/EndClient even if onOwningRefChange()
  // never fired for some reason.
  const owningType = document.getElementById("tf_owntype") ? document.getElementById("tf_owntype").value : "AdHoc";
  const owningRefId = document.getElementById("tf_ownref") ? document.getElementById("tf_ownref").value : "";
  let owningAgreement = null, owningWorkOrder = null;
  if(owningType === "Agreement" && owningRefId){
    owningAgreement = state.agreements.find(a => String(a.id)===String(owningRefId));
    if(owningAgreement){
      clientId = ticketLookupId(owningAgreement,"Client") || clientId;
      endClientId = ticketLookupId(owningAgreement,"EndClient") || endClientId;
    }
  } else if(owningType === "WorkOrder" && owningRefId){
    owningWorkOrder = state.workOrders.find(w => String(w.id)===String(owningRefId));
    if(owningWorkOrder){
      clientId = ticketLookupId(owningWorkOrder,"Client") || clientId;
      endClientId = ticketLookupId(owningWorkOrder,"EndClient") || endClientId;
    }
  }

  const targets = resolveTargetsFor(priority, clientId, endClientId, owningAgreement?.id);
  const assignee = resolveAssignPicker("tf");

  const fields = {
    Title: title,
    ShortDescription: (document.getElementById("tf_shortdesc")?.value || "").trim(),
    TicketType: document.getElementById("tf_type").value,
    Priority: priority,
    OwningEntityType: owningType,
    RequestedByName: document.getElementById("tf_reqname").value,
    RequestedByEmail: document.getElementById("tf_reqemail").value,
    AssignedToName: assignee.name,
    AssignedToEmail: assignee.email,
    Billable: document.getElementById("tf_billable").value === "true",
    RateOverride: document.getElementById("tf_rate") ? (Number(document.getElementById("tf_rate").value)||0) : 0,
    Source: opts.source || document.getElementById("tf_source").value,
    SourceMessageId: opts.sourceMessageId || "",
    Description: document.getElementById("tf_desc").value,
    Status: "New",
    DateOpened: now.toISOString(),
    ResponseDueAt: addBusinessHours(now, targets.response).toISOString(),
    ResolutionDueAt: addBusinessHours(now, targets.resolution).toISOString()
  };
  if(clientId) fields.ClientLookupId = Number(clientId);
  if(endClientId) fields.EndClientLookupId = Number(endClientId);
  if(owningAgreement) fields.OwningAgreementLookupId = Number(owningAgreement.id);
  if(owningWorkOrder) fields.OwningWorkOrderLookupId = Number(owningWorkOrder.id);
  // Raised from a CSA Agreement's Scope of Work Subtask (via the "+ Raise
  // ticket" button)? Carry those two extra, more granular owning-entity
  // links too — the Agreement link above still resolves rate/targets as
  // normal, these are purely for the Scope Item/Subtask breadcrumb.
  if(owningAgreement && raiseTicketSubtaskContext){
    if(raiseTicketSubtaskContext.scopeItemId) fields.OwningScopeItemLookupId = Number(raiseTicketSubtaskContext.scopeItemId);
    if(raiseTicketSubtaskContext.subtaskId) fields.OwningSubtaskLookupId = Number(raiseTicketSubtaskContext.subtaskId);
  }
  raiseTicketSubtaskContext = null;

  try{
    // Creating a ticket is several sequential writes (the ticket itself, its
    // TicketNumber, a CSA_ActiveEntities sync, an assignment-history entry)
    // plus a couple of notification emails. Batched so all of that collapses
    // into a single background refresh afterwards instead of the page
    // reloading itself repeatedly while these settle one by one.
    await withBatchedRefresh(async () => {
      const created = await graphCreateItem("SLA_Tickets", fields);
      const ticketNumber = "SLA-" + created.id;
      await graphUpdateItem("SLA_Tickets", created.id, { TicketNumber: ticketNumber });
      created.fields.TicketNumber = ticketNumber;
      state.tickets.push(created);
      closeModal();
      toast(`Created ${ticketNumber}`);
      // New tickets start "New" (open), so this makes the ticket itself
      // immediately selectable in CG Time's Time Tracking Widget.
      await syncTicketActiveEntity(created);
      // Let the person who raised it know it's been received, and give them
      // the tracking number. Awaited (unlike the other notification emails)
      // because its conversationId needs saving onto the ticket before this
      // batch's refresh — that's the hook Email Intake later uses to match a
      // reply back to this ticket automatically.
      const ackConversationId = await sendTicketAcknowledgment(created);
      if(ackConversationId){
        try{
          await graphUpdateItem("SLA_Tickets", created.id, { AckConversationId: ackConversationId });
          created.fields.AckConversationId = ackConversationId;
        }catch(e){ console.warn("Couldn't save the acknowledgment email's conversation id onto the ticket:", e); }
      }
      // Record the ticket's starting assignment (even "unassigned") as the
      // first entry in its assignment history, so the trail is complete from
      // creation, not just from the first reassignment.
      if(fields.AssignedToName || fields.AssignedToEmail){
        await logTicketAssignmentChange(created.id, "", "", fields.AssignedToName, fields.AssignedToEmail);
        const assignConversationId = await notifyTicketAssigned(created, fields.AssignedToName, fields.AssignedToEmail);
        if(assignConversationId){
          try{
            await graphUpdateItem("SLA_Tickets", created.id, { AssignConversationId: assignConversationId });
            created.fields.AssignConversationId = assignConversationId;
          }catch(e){ console.warn("Couldn't save the assignment email's conversation id onto the ticket:", e); }
        }
      }
    });
  }catch(e){ console.error(e); toast("Couldn't create ticket: " + e.message, true); }
}

// Shared "Assigned to" picker, used on ticket creation and Assign/Reassign —
// active resources only, sorted alphabetically. Selecting one resolves to a
// plain Name + MatchEmail pair, same as the AssignedToName/AssignedToEmail
// fields already on SLA_Tickets — no schema change, just a cleaner source.
function resourceOptions(selectedEmail){
  const email = (selectedEmail||"").toLowerCase().trim();
  return state.resources
    .filter(r => r.fields.IsActive !== false)
    .slice().sort((a,b)=> (a.fields.Title||"").localeCompare(b.fields.Title||""))
    .map(r => `<option value="${r.id}" ${(r.fields.MatchEmail||"").toLowerCase().trim()===email && email ? "selected":""}>${esc(r.fields.Title)}${r.fields.ResourceType?` (${esc(r.fields.ResourceType)})`:""}</option>`)
    .join("");
}
function assignPickerHtml(idPrefix, selectedEmail){
  return `

// Resolves the selected <select id="{idPrefix}_assign"> option back to a
// {name, email} pair for writing to AssignedToName/AssignedToEmail.
function resolveAssignPicker(idPrefix){
  const el = document.getElementById(idPrefix+"_assign");
  const resourceId = el ? el.value : "";
  if(!resourceId) return { name:"", email:"" };
  const r = state.resources.find(x=>String(x.id)===String(resourceId));
  return r ? { name: r.fields.Title||"", email: r.fields.MatchEmail||"" } : { name:"", email:"" };
}

function priorityOverrideFields(prefix, existing){

    <div class="field"><label>${p} resolution (hrs)</label><input id="${prefix}_res_${p}" type="number" value="${f["ResolutionTarget"+p]??""}" placeholder="inherit"></div>
  `).join("");
}
function readPriorityOverrideFields(prefix){
  const out = {};
  ["Critical","High","Normal","Low"].forEach(p=>{
    const r = document.getElementById(`${prefix}_resp_${p}`).value;

    out["ResponseTarget"+p] = r===""?null:Number(r);
    out["ResolutionTarget"+p] = s===""?null:Number(s);
  });
  return out;
}

// Real CSAs abbreviate the counterparty from a trailing parenthetical in its
// name (e.g. "Department of Personnel Management (DPM)" -> "DPM") — same
// convention CSA HUB uses. Falls back to the full name if there's no parens.
function agreementCounterpartyAbbr(clientTitle){
  if(!clientTitle) return "the Client";
  const m = clientTitle.match(/\(([^)]+)\)\s*$/);
  return m ? m[1] : clientTitle;
}

// Sequential per-year numbering: "CSA " + year + 2-digit sequence, resetting
// each calendar year — matches the real CSA 202501-style numbering exactly.
// Creates the year's counter row on first use. Same read-then-write pattern
// (and same small race-condition caveat) as SLA HUB's existing invoice
// numbering (reserveNextInvoiceNumber()).
async function getNextAgreementNumber(){
  const year = new Date().getFullYear();
  const rows = await fetchAllListItems("SLA_AgreementCounter");
  let row = rows.find(r => Number(r.fields.Year) === year);
  if(!row){
    row = await graphCreateItem("SLA_AgreementCounter", { Title: String(year), Year: year, LastSeq: 0 });
  }
  const next = (Number(row.fields.LastSeq)||0) + 1;
  await graphUpdateItem("SLA_AgreementCounter", row.id, { LastSeq: next });
  return "CSA " + year + String(next).padStart(2, "0");
}

/* ---------- Agreement fee lines (Time & Materials rate card) ---------- */
function agreementFeeLines(agreementId){
  return state.agreementFeeLines
    .filter(x => String(ticketLookupId(x,"Agreement"))===String(agreementId))
    .sort((a,b)=>(Number(a.fields.SortOrder)||0)-(Number(b.fields.SortOrder)||0));
}

// Subtotal/tax/total computed live from the current fee lines — never
// trusted from stale cached fields while rendering, only written back to
// the Agreement record (SubtotalAmount/TaxAmount/TotalAmount) so the
// Agreements list can show a total without re-summing every line item.
function feeLineTotals(agreementId, taxRatePercent){
  const lines = agreementFeeLines(agreementId);
  const subtotal = lines.reduce((s,x)=> s + (Number(x.fields.RatePerDay)||0) * (Number(x.fields.EstimatedDays)||0), 0);
  const rate = (taxRatePercent===undefined || taxRatePercent===null || taxRatePercent==="") ? 10 : Number(taxRatePercent);
  const tax = Math.round(subtotal * (rate/100) * 100) / 100;
  return { subtotal, tax, total: subtotal + tax, taxRatePercent: rate };
}

async function recalcAndPersistAgreementTotals(agreementId){
  const a = state.agreements.find(x=>String(x.id)===String(agreementId));
  if(!a) return;
  const t = feeLineTotals(agreementId, a.fields.TaxRatePercent);
  await graphUpdateItem("SLA_Agreements", agreementId, { SubtotalAmount: t.subtotal, TaxAmount: t.tax, TotalAmount: t.total });
  Object.assign(a.fields, { SubtotalAmount: t.subtotal, TaxAmount: t.tax, TotalAmount: t.total });
}

async function addFeeLine(agreementId){

  try{

      Title: role, AgreementLookupId: Number(agreementId),
      Role: role, RatePerDay: rate, EstimatedDays: days, SortOrder: sortOrder
    });
    state.agreementFeeLines.push(created);
    await recalcAndPersistAgreementTotals(agreementId);

  try{

// A ticket raised from a Subtask's "+ Raise ticket" button — opens the
// normal New Ticket form pre-set to this Agreement, and stashes the
// Scope Item / Subtask so submitTicketFormCore() can also persist those
// two extra, more granular owning-entity links (see raiseTicketSubtaskContext).
let raiseTicketSubtaskContext = null;
function raiseTicketFromSubtask(agreementId, scopeItemId, subtaskId){
  const subtask = state.agreementSubtasks.find(x=>String(x.id)===String(subtaskId));
  openTicketForm(); // resets raiseTicketSubtaskContext to null — set it below, after
  raiseTicketSubtaskContext = { scopeItemId, subtaskId };
  presetOwningEntity("Agreement", agreementId);
  if(subtask && subtask.fields.AssignedToEmail){
    const resourceSel = document.getElementById("tf_assign");
    if(resourceSel){
      const r = state.resources.find(x => (x.fields.MatchEmail||"").toLowerCase() === subtask.fields.AssignedToEmail.toLowerCase());
      if(r) resourceSel.value = r.id;
    }
  }
}

// Same idea, but raised directly against a Scope of Work item rather than
// one of its Subtasks — for work that doesn't need to be broken down first.
function raiseTicketFromScopeItem(agreementId, scopeItemId){
  openTicketForm(); // resets raiseTicketSubtaskContext to null — set it below, after
  raiseTicketSubtaskContext = { scopeItemId, subtaskId: null };
  presetOwningEntity("Agreement", agreementId);
}

/* ---------- Word document generation (docx.js) ---------- */
function wdParaA(text, opts={}){
  return new docx.Paragraph({
    alignment: opts.align,
    spacing: { before: opts.before || 0, after: opts.after !== undefined ? opts.after : 120 },
    children: [ new docx.TextRun({ text: text || "", bold: !!opts.bold, italics: !!opts.italics, size: opts.size || 22 }) ]
  });
}
function wdLabeledParaA(label, value){
  return new docx.Paragraph({
    spacing: { after: 100 },
    children: [
      new docx.TextRun({ text: label + " ", bold: true, size: 22 }),
      new docx.TextRun({ text: value || "", size: 22 })
    ]
  });
}
function wdSectionHeadingA(text){
  return new docx.Paragraph({
    alignment: docx.AlignmentType.CENTER,
    spacing: { before: 300, after: 200 },
    border: { bottom: { style: docx.BorderStyle.SINGLE, size: 6, color: "1a1a1a" } },
    children: [ new docx.TextRun({ text: text.toUpperCase(), bold: true, size: 24 }) ]
  });
}
function wdHeaderCellA(text, widthPct, align){
  return new docx.TableCell({
    width: { size: widthPct, type: docx.WidthType.PERCENTAGE },
    shading: { fill: "F2F2F2" },
    children: [ new docx.Paragraph({ alignment: align || docx.AlignmentType.LEFT, children: [ new docx.TextRun({ text: text || "", bold: true, size: 18 }) ] }) ]
  });
}
function wdCellA(text, opts={}){
  return new docx.TableCell({
    width: opts.width ? { size: opts.width, type: docx.WidthType.PERCENTAGE } : undefined,
    children: [ new docx.Paragraph({ alignment: opts.align || docx.AlignmentType.LEFT, children: [ new docx.TextRun({ text: text || "", bold: !!opts.bold, size: opts.size || 20 }) ] }) ]
  });
}
function wdSigLineA(label){
  return [
    new docx.Paragraph({ spacing: { before: 120, after: 40 }, children: [ new docx.TextRun({ text: label, bold: true, size: 21 }) ] }),
    new docx.Paragraph({ border: { bottom: { style: docx.BorderStyle.SINGLE, size: 4, color: "1a1a1a" } }, spacing: { after: 80 }, children: [ new docx.TextRun({ text: " ", size: 21 }) ] })
  ];
}
function wdSigCellA(nameLabel, titleLabel, name, title){
  return new docx.TableCell({
    width: { size: 50, type: docx.WidthType.PERCENTAGE },
    children: [
      ...wdSigLineA("Signed:"),
      new docx.Paragraph({ spacing: { after: 60 }, children: [ new docx.TextRun({ text: "Name: " + (name||""), size: 21 }) ] }),
      new docx.Paragraph({ spacing: { after: 60 }, children: [ new docx.TextRun({ text: "Title: " + (title||""), size: 21 }) ] }),
      ...wdSigLineA("Date:")
    ]
  });
}

async function fetchImageBytesA(url){
  try{
    const res = await fetch(url);
    if(!res.ok) return null;
    return new Uint8Array(await res.arrayBuffer());
  }catch(err){
    console.warn("Could not fetch logo image for Word document:", err);
    return null;
  }
}

async function generateAgreementWordDocument(agreementId){
  const a = state.agreements.find(x=>String(x.id)===String(agreementId));
  if(!a) return;
  const f = a.fields;
  const client = state.clients.find(c=>String(c.id)===String(ticketLookupId(a,"Client")));
  const clientName = client?.fields?.Title || "Client";
  const counterparty = agreementCounterpartyAbbr(clientName);
  const feeLines = agreementFeeLines(agreementId);
  const totals = feeLineTotals(agreementId, f.TaxRatePercent);
  const ccy = client?.fields?.Currency || "PGK";

  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = "Generating…"; btn.disabled = true;

  try{
    if(typeof docx === "undefined" || typeof saveAs === "undefined"){
      throw new Error("The Word generation library didn't load — check your internet connection and try again.");
    }

    const logoBytes = await fetchImageBytesA(CONCEPT_ENTITY.logoUrl);
    const children = [];

    if(logoBytes){
      children.push(new docx.Paragraph({
        alignment: docx.AlignmentType.RIGHT, spacing: { after: 160 },
        children: [ new docx.ImageRun({ type: "jpg", data: logoBytes, transformation: { width: 132, height: 50 } }) ]
      }));
    }

    children.push(new docx.Paragraph({
      alignment: docx.AlignmentType.CENTER, spacing: { after: 240 },
      children: [ new docx.TextRun({ text: "Consultancy Services Agreement", bold: true, size: 32 }) ]
    }));

    children.push(wdLabeledParaA("AGREEMENT No:", f.AgreementNumber || ("AGR-"+a.id)));
    children.push(wdLabeledParaA("BETWEEN:", `${CONCEPT_ENTITY.name} ("${CONCEPT_ENTITY.shortName}")`));
    children.push(wdLabeledParaA("AND:", `${clientName} ("${counterparty}")`));

    children.push(new docx.Paragraph({
      spacing: { before: 200, after: 200 }, alignment: docx.AlignmentType.JUSTIFIED,
      children: [
        new docx.TextRun({ text: "AGREEMENT: ", bold: true, size: 22 }),
        new docx.TextRun({ text: `In consideration of payment by ${counterparty} of the fees indicated, ${CONCEPT_ENTITY.shortName} agrees to provide ${counterparty} with services necessary to perform the Works identified in the Services Schedule. Unless expressly stated otherwise, times to perform works are estimates only. The parties acknowledge and agree that this Agreement shall be subject to the Terms and Conditions set out on the following pages.`, size: 22 })
      ]
    }));

    children.push(wdSectionHeadingA("Services Schedule"));
    children.push(wdLabeledParaA("PROJECT NAME:", f.Title || ""));

    const scopeItems = agreementScopeItems(agreementId);
    if(scopeItems.length){
      children.push(new docx.Paragraph({ spacing: { before: 160, after: 60 }, children: [ new docx.TextRun({ text: "WORKS:", bold: true, size: 22 }) ] }));
      scopeItems.forEach((s,i) => {
        children.push(wdParaA(`${i+1}. ${s.fields.Title}${s.fields.Description ? " — " + s.fields.Description : ""}`, { size: 21, after: 80 }));
      });
    }

    children.push(wdParaA(`Commencement Date: ${f.StartDate ? fmtDate(f.StartDate) : "When CSA is signed by both parties"}     Termination Date: ${f.TermDescription || (f.EndDate ? fmtDate(f.EndDate) : "Not specified")}`, { size: 21, before: 160, after: 100 }));
    children.push(wdParaA("FEE BASIS: TIME AND MATERIALS", { size: 21, after: 160, bold: true }));

    const tableRows = [
      new docx.TableRow({ tableHeader: true, children: [
        wdHeaderCellA("SERVICE", 35), wdHeaderCellA("RATE/DAY", 20, docx.AlignmentType.RIGHT),
        wdHeaderCellA("ESTIMATED DAYS", 20, docx.AlignmentType.RIGHT), wdHeaderCellA("ESTIMATED COST", 25, docx.AlignmentType.RIGHT)
      ] })
    ];
    feeLines.forEach(x => {
      const rate = Number(x.fields.RatePerDay)||0, days = Number(x.fields.EstimatedDays)||0;
      tableRows.push(new docx.TableRow({ children: [
        wdCellA(x.fields.Role||"", { width: 35 }),
        wdCellA(fmtMoney(rate, ccy), { width: 20, align: docx.AlignmentType.RIGHT }),
        wdCellA(String(days), { width: 20, align: docx.AlignmentType.RIGHT }),
        wdCellA(fmtMoney(rate*days, ccy), { width: 25, align: docx.AlignmentType.RIGHT })
      ] }));
    });
    tableRows.push(new docx.TableRow({ children: [
      wdCellA("Subtotal", { width: 75, bold: true, align: docx.AlignmentType.RIGHT }),
      wdCellA(fmtMoney(totals.subtotal, ccy), { width: 25, bold: true, align: docx.AlignmentType.RIGHT })
    ] }));
    tableRows.push(new docx.TableRow({ children: [
      wdCellA(`Plus ${totals.taxRatePercent}% Goods & Technical Services (GST)`, { width: 75, bold: true, align: docx.AlignmentType.RIGHT }),
      wdCellA(fmtMoney(totals.tax, ccy), { width: 25, bold: true, align: docx.AlignmentType.RIGHT })
    ] }));
    tableRows.push(new docx.TableRow({ children: [
      wdCellA("Total Inc. GST", { width: 75, bold: true, align: docx.AlignmentType.RIGHT }),
      wdCellA(fmtMoney(totals.total, ccy), { width: 25, bold: true, align: docx.AlignmentType.RIGHT })
    ] }));
    children.push(new docx.Table({ width: { size: 100, type: docx.WidthType.PERCENTAGE }, rows: tableRows }));

    children.push(new docx.Paragraph({ spacing: { before: 400, after: 120 }, children: [
      new docx.TextRun({ text: `Executed by ${counterparty}: (Authorised Signature)          Executed by ${CONCEPT_ENTITY.shortName}: (Authorised Signature)`, bold: true, size: 21 })
    ] }));
    children.push(new docx.Table({
      width: { size: 100, type: docx.WidthType.PERCENTAGE },
      borders: {
        top: { style: docx.BorderStyle.NONE }, bottom: { style: docx.BorderStyle.NONE },
        left: { style: docx.BorderStyle.NONE }, right: { style: docx.BorderStyle.NONE },
        insideHorizontal: { style: docx.BorderStyle.NONE }, insideVertical: { style: docx.BorderStyle.NONE }
      },
      rows: [ new docx.TableRow({ children: [
        wdSigCellA("Name:", "Title:", f.ClientSignatoryName, f.ClientSignatoryTitle),
        wdSigCellA("Name:", "Title:", f.ConceptSignatoryName || CONCEPT_DEFAULT_SIGNATORY_NAME, f.ConceptSignatoryTitle || CONCEPT_DEFAULT_SIGNATORY_TITLE)
      ] }) ]
    }));

    children.push(new docx.Paragraph({ children: [], pageBreakBefore: true }));
    children.push(new docx.Paragraph({ spacing: { after: 200 }, children: [ new docx.TextRun({ text: "Terms and Conditions", bold: true, size: 28 }) ] }));
    agreementTermsPlainText(counterparty).forEach(term => {
      children.push(new docx.Paragraph({ spacing: { before: 160, after: 60 }, children: [ new docx.TextRun({ text: `${term.num}. ${term.title}`, bold: true, size: 22 }) ] }));
      term.body.forEach(para => {
        children.push(new docx.Paragraph({ alignment: docx.AlignmentType.JUSTIFIED, spacing: { after: 100 }, children: [ new docx.TextRun({ text: para, size: 20 }) ] }));
      });
    });

    const doc = new docx.Document({ sections: [{ properties: {}, children }] });
    const blob = await docx.Packer.toBlob(doc);
    saveAs(blob, `${f.AgreementNumber || ("AGR-"+a.id)} - ${clientName}.docx`);

  }catch(err){
    console.error(err);
    toast("Couldn't generate Word document: " + err.message, true);
  }finally{
    btn.textContent = originalText; btn.disabled = false;
  }
}

// Scope of Work — the CSA's numbered Works items, now structured records
// instead of free text. Each item can carry Subtasks; a ticket is raised
// directly against a Subtask and assigned to someone from there. Kept
// compact: a scope item is a single line by default (icon actions on the
// right), its "add subtask" row only appears when the + icon is clicked,
// and clicking its title switches that one row into an inline edit field.
let scopeUIState = { editingId: null, addSubtaskOpenId: null };

function toggleAddSubtaskRow(scopeItemId, agreementId){
  scopeUIState.addSubtaskOpenId = (scopeUIState.addSubtaskOpenId === scopeItemId) ? null : scopeItemId;
  scopeUIState.editingId = null;
  renderAgreementDetail();
}
function startEditScopeItem(scopeItemId, agreementId){
  scopeUIState.editingId = scopeItemId;
  scopeUIState.addSubtaskOpenId = null;
  renderAgreementDetail();
}
function cancelEditScopeItem(agreementId){
  scopeUIState.editingId = null;
  renderAgreementDetail();
}
async function saveScopeItemEdit(scopeItemId, agreementId){
  const ta = document.getElementById(`scope_edit_title_${scopeItemId}`);
  const title = (ta?.value||"").trim();
  if(!title){ toast("Scope item can't be blank", true); return; }
  const s = state.agreementScopeItems.find(x=>String(x.id)===String(scopeItemId));
  try{
    await graphUpdateItem("SLA_AgreementScopeItems", scopeItemId, { Title: title });
    if(s) s.fields.Title = title;
    scopeUIState.editingId = null;
    renderAgreementDetail();
  }catch(e){ console.error(e); toast("Couldn't save scope item: " + e.message, true); }
}

function renderAgreementScopeOfWork(a){
  const items = agreementScopeItems(a.id);

async function submitAgreementForm(id){
  const title = document.getElementById("agf_title").value.trim();
  if(!title){ toast("Title is required", true); return; }
  const clientId = document.getElementById("agf_client").value;
  const endClientId = document.getElementById("agf_endclient").value;
  const status = document.getElementById("agf_status").value;
  const fields = {
    Title: title,
    Status: status,
    Rate: Number(document.getElementById("agf_rate").value)||0,
    StartDate: document.getElementById("agf_start").value ? new Date(document.getElementById("agf_start").value).toISOString() : null,
    EndDate: document.getElementById("agf_end").value ? new Date(document.getElementById("agf_end").value).toISOString() : null,
    TermDescription: document.getElementById("agf_termdesc").value,
    TaxRatePercent: Number(document.getElementById("agf_taxrate").value) || 0,
    ClientSignatoryName: document.getElementById("agf_clientsigname").value,
    ClientSignatoryTitle: document.getElementById("agf_clientsigtitle").value,
    ConceptSignatoryName: document.getElementById("agf_conceptsigname").value,
    ConceptSignatoryTitle: document.getElementById("agf_conceptsigtitle").value,
    Notes: document.getElementById("agf_notes").value,
    ...readPriorityOverrideFields("agf")
  };
  if(clientId) fields.ClientLookupId = Number(clientId);
  if(endClientId) fields.EndClientLookupId = Number(endClientId);
  try{
    let a;
    if(id){
      await graphUpdateItem("SLA_Agreements", id, fields);
      a = state.agreements.find(x=>String(x.id)===String(id));
      Object.assign(a.fields, fields);
    } else {
      a = await graphCreateItem("SLA_Agreements", fields);
      const num = await getNextAgreementNumber();
      await graphUpdateItem("SLA_Agreements", a.id, { AgreementNumber: num });
      a.fields.AgreementNumber = num;
      state.agreements.push(a);
    }
    closeModal(); toast("Agreement saved"); renderAgreementsList();
    syncActiveEntity("Agreement", activeEntityTitleFor("Agreement", a), a.fields.Title, false);
  }catch(e){ console.error(e); toast("Couldn't save agreement: " + e.message, true); }
}

    await graphUpdateItem("SLA_WorkOrders", id, { Status: status });
    w.fields.Status = status;
    toast("Status updated"); renderWorkOrdersList(); workOrderDetailId=id; renderWorkOrderDetail();
    // Work Orders aren't directly loggable in the widget any more — time
    // attaches to the Ticket, therefore to its parent Work Order (see
    // syncTicketActiveEntity()). Self-heals a stale widget row if one exists.
    syncActiveEntity("WorkOrder", activeEntityTitleFor("WorkOrder", w), w.fields.Title, false);
  }catch(e){ console.error(e); toast("Couldn't update status: " + e.message, true); }
}

async function submitWorkOrderForm(id){
  const title = document.getElementById("wof_title").value.trim();
  if(!title){ toast("Title is required", true); return; }
  const clientId = document.getElementById("wof_client").value;
  const endClientId = document.getElementById("wof_endclient").value;
  const status = document.getElementById("wof_status").value;
  const fields = {
    Title: title,
    Status: status,
    Rate: Number(document.getElementById("wof_rate").value)||0,
    StartDate: document.getElementById("wof_start").value ? new Date(document.getElementById("wof_start").value).toISOString() : null,
    TargetCompletionDate: document.getElementById("wof_target").value ? new Date(document.getElementById("wof_target").value).toISOString() : null,
    Scope: document.getElementById("wof_scope").value,
    Notes: document.getElementById("wof_notes").value
  };
  if(clientId) fields.ClientLookupId = Number(clientId);
  if(endClientId) fields.EndClientLookupId = Number(endClientId);
  try{
    let w;
    if(id){
      await graphUpdateItem("SLA_WorkOrders", id, fields);
      w = state.workOrders.find(x=>String(x.id)===String(id));
      Object.assign(w.fields, fields);
    } else {
      w = await graphCreateItem("SLA_WorkOrders", fields);
      const num = "WO-" + w.id;
      await graphUpdateItem("SLA_WorkOrders", w.id, { WorkOrderNumber: num });
      w.fields.WorkOrderNumber = num;
      state.workOrders.push(w);
    }
    closeModal(); toast("Work order saved"); renderWorkOrdersList();
    syncActiveEntity("WorkOrder", activeEntityTitleFor("WorkOrder", w), w.fields.Title, false);
  }catch(e){ console.error(e); toast("Couldn't save work order: " + e.message, true); }
}

async function submitDirectLogTime(type, refId){
  const hours = Number(document.getElementById("dlt_hours").value);
  if(!hours || hours<=0){ toast("Enter hours logged", true); return; }
  const entityLabel = type==="Agreement" ? (state.agreements.find(a=>String(a.id)===String(refId))?.fields?.Title||"")
    : type==="WorkOrder" ? (state.workOrders.find(w=>String(w.id)===String(refId))?.fields?.Title||"")
    : (state.clients.find(c=>String(c.id)===String(refId))?.fields?.Title||"");
  const fields = {
    Title: "Time entry — " + entityLabel,
    WorkDate: new Date(document.getElementById("dlt_date").value).toISOString(),
    EntryUser: (currentAccount?.username || "").toLowerCase().trim(),
    Hours: hours,
    EntryMethod: "Manual",
    Billable: document.getElementById("dlt_billable").value === "true",
    ActivityDetail: document.getElementById("dlt_detail").value,
    OwningEntityType: type
  };
  if(type==="Agreement") fields.OwningAgreementLookupId = Number(refId);
  else if(type==="WorkOrder") fields.OwningWorkOrderLookupId = Number(refId);
  else fields.OwningClientLookupId = Number(refId);
  try{
    const created = await graphCreateItem("SLA_TimeEntries", fields);
    state.timeEntries.push(created);
    closeModal(); toast("Time logged");
    if(type==="Agreement") renderAgreementDetail();
    else if(type==="WorkOrder") renderWorkOrderDetail();
    else renderAdHocDetail();
  }catch(e){ console.error(e); toast("Couldn't log time: " + e.message, true); }
}

let invoicesTab = "list";
let invoiceDraftLines = [];
let invoiceDraftClientId = null;

const XERO_CSV_HEADERS = ["ContactName","EmailAddress","POAddressLine11","POCity","POCountry","PORegion",
  "InvoiceNumber","Reference","InvoiceDate","DueDate","Total","InventoryItemCode","Description","Quantity",
  "UnitAmount","AccountCode","TaxType","TaxAmount","TrackingName1","TrackingOption1","Currency"];

function renderGenerateInvoice(){
  document.getElementById("invoicesBody").innerHTML = `
    <div class="card">
      <div class="form-grid">
        <div class="field"><label>Client</label><select id="gi_client" onchange="document.getElementById('gi_endclient').innerHTML=endClientOptions(this.value)+'<option value=&quot;&quot;>— all end clients —</option>'; invoiceDraftClientId=this.value;">

      </div>

    <div id="giLinesWrap"></div>
  `;
}

function alreadyInvoicedTicketIds(){
  const ids = new Set();
  state.invoices.forEach(inv=>{
    try{
      const lines = JSON.parse(inv.fields.LineItems || "[]");
      lines.forEach(l => { if(l.TicketId) ids.add(String(l.TicketId)); });
    }catch(e){}
  });
  return ids;
}

function loadEligibleTickets(){
  const clientId = document.getElementById("gi_client").value;
  const endClientId = document.getElementById("gi_endclient").value;
  if(!clientId){ toast("Select a client first", true); return; }
  const invoiced = alreadyInvoicedTicketIds();
  const eligible = state.tickets.filter(t => {
    if(!t.fields.Billable) return false;
    if(!["Resolved","Closed"].includes(t.fields.Status)) return false;
    if(String(ticketLookupId(t,"Client")) !== String(clientId)) return false;
    if(endClientId && String(ticketLookupId(t,"EndClient")) !== String(endClientId)) return false;
    if(invoiced.has(String(t.id))) return false;
    return true;
  });
  invoiceDraftLines = eligible.map(t => {
    const hours = state.timeEntries.filter(e=>String(e.fields.TicketId)===String(t.id)).reduce((s,e)=>s+(Number(e.fields.Hours)||0),0);
    const qty = hours > 0 ? hours : 1;
    const rate = resolveRate(t);
    return { ticketId: t.id, description: `${t.fields.TicketNumber} — ${t.fields.Title}`, quantity: qty, unitAmount: rate, include: true };
  });
  renderGiLines();
}

function renderGiLines(){
  const wrap = document.getElementById("giLinesWrap");
  if(!invoiceDraftLines.length){ wrap.innerHTML = `<div class="empty">No eligible unbilled tickets for this selection.</div>`; return; }
  const client = state.clients.find(c=>String(c.id)===String(invoiceDraftClientId));
  const taxRate = client?.fields?.TaxType === "Zero Rated" ? 0 : 0.10;
  let subtotal = 0;
  invoiceDraftLines.forEach(l => { if(l.include) subtotal += l.quantity*l.unitAmount; });
  const tax = Math.round(subtotal*taxRate*100)/100;
  const total = subtotal+tax;

  wrap.innerHTML = `
    <div class="card">
      <table><thead><tr><th></th><th>Ticket</th><th>Qty (hrs)</th><th>Rate</th><th>Line total</th></tr></thead>
      <tbody>${invoiceDraftLines.map((l,i)=>`<tr>
        <td><input type="checkbox" ${l.include?"checked":""} onchange="invoiceDraftLines[${i}].include=this.checked; renderGiLines();"></td>
        <td>${esc(l.description)}</td>
        <td><input type="number" step="0.25" value="${l.quantity}" style="width:70px;" onchange="invoiceDraftLines[${i}].quantity=Number(this.value); renderGiLines();"></td>
        <td><input type="number" step="0.01" value="${l.unitAmount}" style="width:80px;" onchange="invoiceDraftLines[${i}].unitAmount=Number(this.value); renderGiLines();"></td>
        <td>${fmtMoney(l.quantity*l.unitAmount, client?.fields?.Currency)}</td>
      </tr>`).join("")}</tbody></table>
      <div style="text-align:right;margin-top:14px;font-size:14px;">
        <div>Subtotal: ${fmtMoney(subtotal, client?.fields?.Currency)}</div>
        <div>Tax (${client?.fields?.TaxType||"—"}): ${fmtMoney(tax, client?.fields?.Currency)}</div>
        <div style="font-weight:800;font-size:16px;">Total: ${fmtMoney(total, client?.fields?.Currency)}</div>
      </div>
      <div class="modal-actions" style="justify-content:flex-start;margin-top:14px;">
        <button class="btn btn-accent" onclick="confirmGenerateInvoice()">Generate invoice &amp; export CSV</button>
      </div>
    </div>
  `;
}

async function reserveNextInvoiceNumber(){
  const seq = await fetchAllListItems("SLA_LastInvoiceNumber");
  const row = seq[0];
  const next = (Number(row?.fields?.LastInvoiceNo)||5000) + 1;
  await graphUpdateItem("SLA_LastInvoiceNumber", row.id, { LastInvoiceNo: next });
  return "SLA-" + next;
}

async function confirmGenerateInvoice(){
  const included = invoiceDraftLines.filter(l=>l.include);
  if(!included.length){ toast("Select at least one line", true); return; }
  const client = state.clients.find(c=>String(c.id)===String(invoiceDraftClientId));
  if(!client){ toast("No client selected", true); return; }
  const taxRate = client.fields.TaxType === "Zero Rated" ? 0 : 0.10;
  const subtotal = included.reduce((s,l)=>s+l.quantity*l.unitAmount,0);
  const tax = Math.round(subtotal*taxRate*100)/100;
  const total = subtotal+tax;
  const now = new Date();
  const dueDate = new Date(now.getTime() + 14*86400000);

  try{
    const invoiceNo = await reserveNextInvoiceNumber();
    const lineItems = included.map(l => ({
      TicketId: l.ticketId, Description: l.description, Quantity: l.quantity,
      UnitAmount: l.unitAmount, SubTotal: Math.round(l.quantity*l.unitAmount*100)/100,
      TaxAmount: Math.round(l.quantity*l.unitAmount*taxRate*100)/100
    }));
    const fields = {
      Title: invoiceNo,
      InvoiceDate: now.toISOString(), DueDate: dueDate.toISOString(),
      BillingMonth: now.toLocaleString("en-AU",{month:"long",year:"numeric"}),
      ClientLookupId: Number(client.id),
      ContactName: client.fields.ClientInvoiceName || client.fields.Title,
      EmailAddress: client.fields.EmailAddress || "",
      Currency: client.fields.Currency || "PGK",
      TaxType: client.fields.TaxType || "Tax on Sales",
      AccountCode: client.fields.AccountCode || "201",
      Reference: "",
      SubTotal: Math.round(subtotal*100)/100, TaxAmount: tax, TotalAmount: Math.round(total*100)/100,
      Status: "Exported",
      LineItems: JSON.stringify(lineItems)
    };
    const created = await graphCreateItem("SLA_Invoices", fields);
    state.invoices.push(created);
    exportInvoiceCSV(created, client);
    toast(`Generated ${invoiceNo}`);
    invoicesTab = "list"; invoiceDraftLines = [];
    renderInvoices();
  }catch(e){ console.error(e); toast("Couldn't generate invoice: " + e.message, true); }
}

function trackingOptionForTicketId(ticketId){
  // Each invoice line's Xero tracking option is that specific ticket's End
  // Client — this is what lets several End Clients sharing one Xero Contact
  // (e.g. ANZ PNG / ANZ Fiji under DayForce) split correctly in Xero reports.
  const ticket = state.tickets.find(t => String(t.id) === String(ticketId));
  if(!ticket) return "";
  const endClient = state.endClients.find(ec => String(ec.id) === String(ticketLookupId(ticket,"EndClient")));
  return endClient?.fields?.TrackingOption1 || "";
}

function exportInvoiceCSV(invoice, client){
  const lines = JSON.parse(invoice.fields.LineItems || "[]");
  const rows = lines.map(l => ({
    ContactName: invoice.fields.ContactName, EmailAddress: invoice.fields.EmailAddress,
    POAddressLine11: client?.fields?.POAddressLine1 || "", POCity: client?.fields?.POCity || "",
    POCountry: client?.fields?.POCountry || "", PORegion: client?.fields?.PORegion || "",
    InvoiceNumber: invoice.fields.Title, Reference: invoice.fields.Reference || "",
    InvoiceDate: fmtDate(invoice.fields.InvoiceDate), DueDate: fmtDate(invoice.fields.DueDate),
    Total: 0, InventoryItemCode: client?.fields?.InventoryItemCode || "Bureau",
    Description: l.Description, Quantity: l.Quantity, UnitAmount: l.UnitAmount,
    AccountCode: invoice.fields.AccountCode, TaxType: invoice.fields.TaxType, TaxAmount: l.TaxAmount,
    TrackingName1: client?.fields?.TrackingName1 || "Department",
    TrackingOption1: trackingOptionForTicketId(l.TicketId),
    Currency: invoice.fields.Currency
  }));
  downloadCSV(`${invoice.fields.Title}_${invoice.fields.ContactName}.csv`.replace(/[^a-z0-9._-]/gi,"_"), XERO_CSV_HEADERS, rows);
}

function redownloadInvoiceCSV(id){
  const inv = state.invoices.find(x=>String(x.id)===String(id));
  const client = state.clients.find(c=>String(c.id)===String(inv.fields.ClientLookupId));
  exportInvoiceCSV(inv, client);
}

function downloadCSV(filename, headers, rowObjs){
  const esc_ = v => { const s = String(v==null?"":v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const csv = [headers.join(","), ...rowObjs.map(r => headers.map(h=>esc_(r[h])).join(","))].join("\n");
  const blob = new Blob(["﻿"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
